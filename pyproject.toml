[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-gabriel"
version = "0.1.0"
description = "An experiment in fine-tuning an open-source LLM to imitate a personal conversational style."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36",
    "python-dotenv>=1.0",
    # zoneinfo has no IANA database on Windows; Asia/Singapore lookups need this.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
